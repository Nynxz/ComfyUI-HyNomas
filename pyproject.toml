[project]
name = "comfyui-hynomas"
version = "0.1.0"
description = "Native ComfyUI support for Hy-Nomas (Tencent Hunyuan), the interactive world model: segment-by-segment generation with a KV-cache history, camera control and a WASD explorer node. No extra requirements."
authors = [{ name = "Nynxz", email = "contact@nynxz.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[tool.comfy]
PublisherId = "nynxz"
DisplayName = "HyNomas"

[tool.ruff]
target-version = "py310"
line-length = 130
